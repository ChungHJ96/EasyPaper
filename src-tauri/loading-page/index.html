<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>HJPaper</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #06050a;
    color: #e5e5e5;
    font-family: system-ui, -apple-system, sans-serif;
    gap: 16px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  p {
    margin: 0;
    font-size: 14px;
    color: #a1a1aa;
  }
  .retry-btn {
    display: none;
    margin-top: 8px;
    padding: 8px 16px;
    background: #8b5cf6;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .retry-btn:hover {
    background: #7c3aed;
  }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status-msg">HJPaper 백엔드를 시작하는 중입니다...</p>
  <button id="retry-btn" class="retry-btn" onclick="retryConnect()">새로고침</button>
  <script>
    let elapsed = 0;
    function checkBackend() {
      fetch('http://127.0.0.1:8008/', { method: 'GET', mode: 'no-cors' })
        .then(() => {
          window.location.href = 'http://127.0.0.1:8008/';
        })
        .catch(() => {
          elapsed += 1;
          if (elapsed >= 10) {
            const msg = document.getElementById('status-msg');
            const btn = document.getElementById('retry-btn');
            if (msg) msg.innerText = '백엔드 초기화가 진행 중입니다... (' + elapsed + '초)';
            if (btn && elapsed >= 15) btn.style.display = 'inline-block';
          }
          setTimeout(checkBackend, 1000);
        });
    }
    function retryConnect() {
      window.location.href = 'http://127.0.0.1:8008/';
    }
    setTimeout(checkBackend, 1500);
  </script>
</body>
</html>
